<!doctype html>
<html lang="ko">
<head>

  <meta name="theme-color" content="#fbfbfd">

<body>
  <a class="skip-link" href="#app">본문으로 이동</a>
  <header class="site-header">
    <button class="brand" data-action="home" aria-label="RecoLens 처음 화면"><svg viewBox="0 0 40 28" aria-hidden="true"><circle cx="14" cy="14" r="10.5"/><circle cx="26" cy="14" r="10.5"/></svg><span>recolens<span class="brand-dot">.</span></span></button>
